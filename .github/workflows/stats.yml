name: Generate stats card

on:
  schedule:
    - cron: "0 */12 * * *" # Ajustado: Roda a cada 12h (no cron anterior estava rodando A CADA MINUTO)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate stats.svg
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Adicionado a '?' no inicio das opções
          options: ?username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=radical&locale=en&hide_border=true
          path: dist/stats.svg
          # Troca do GITHUB_TOKEN pelo teu PAT customizado
          token: ${{ secrets.STATS_TOKEN }}

      - name: push stats.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
